# Copy to fly.local.toml and set your unique app name, region and runtime env.
app = "sats-on-ice-CHANGE-ME"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"
  # Migrations run in serve on the mounted volume; no release_command.

[env]
  SOI_DATABASE = "/data/sats-on-ice.sqlite"
  SOI_HOSTNAME = "0.0.0.0"
  SOI_PORT = "3000"
  # Set SOI_MINT_URL and SOI_PAYOUT_THRESHOLD_SATS before deploying.
  # A fresh volume also requires SOI_USERNAME and SOI_XPUB.

[[mounts]]
  source = "soi_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20

  [[http_service.checks]]
    method = "GET"
    path = "/readyz"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
